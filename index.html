<!DOCTYPE html>

<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Ashen Throne — Music Forge</title>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700;900&family=Crimson+Text:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet"/>
<style>
  :root {
  --void: #050508;
  --ash: #0d0d14;
  --ember: #1a0a00;
  --gold: #c8922a;
  --gold-dim: #7a5518;
  --blood: #8b1a1a;
  --blood-bright: #cc2a2a;
  --violet: #3d1a5c;
  --violet-bright: #7a3ab0;
  --fog: #1c1c28;
  --text: #c4b89a;
  --text-dim: #6b6050;
  --rune: #4a6fa5;
}

* { margin: 0; padding: 0; box-sizing: border-box; }

body {
  background: var(--void);
  color: var(--text);
  font-family: 'Crimson Text', serif;
  min-height: 100vh;
  overflow-x: hidden;
  position: relative;
}

/* Atmospheric background */
body::before {
  content: '';
  position: fixed;
  inset: 0;
  background:
    radial-gradient(ellipse 60% 40% at 50% 0%, #1a0a0022 0%, transparent 70%),
    radial-gradient(ellipse 40% 60% at 80% 80%, #0d0a1a44 0%, transparent 60%),
    radial-gradient(ellipse 30% 50% at 10% 60%, #1a080022 0%, transparent 60%);
  pointer-events: none;
  z-index: 0;
}

/* Noise grain overlay */
body::after {
  content: '';
  position: fixed;
  inset: 0;
  opacity: 0.035;
  background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)'/%3E%3C/svg%3E");
  pointer-events: none;
  z-index: 1;
}

.container {
  position: relative;
  z-index: 2;
  max-width: 900px;
  margin: 0 auto;
  padding: 40px 24px 80px;
}

/* Header */
.header {
  text-align: center;
  margin-bottom: 48px;
}

.crown {
  font-size: 11px;
  letter-spacing: 0.35em;
  text-transform: uppercase;
  color: var(--gold-dim);
  font-family: 'Cinzel', serif;
  margin-bottom: 12px;
}

h1 {
  font-family: 'Cinzel', serif;
  font-size: clamp(28px, 5vw, 52px);
  font-weight: 900;
  color: var(--gold);
  text-shadow: 0 0 40px #c8922a44, 0 0 80px #c8922a22;
  line-height: 1.1;
  letter-spacing: 0.04em;
}

h1 span {
  color: var(--text-dim);
  font-weight: 400;
  font-size: 0.55em;
  display: block;
  letter-spacing: 0.2em;
  margin-top: 6px;
}

.divider {
  width: 200px;
  height: 1px;
  background: linear-gradient(90deg, transparent, var(--gold-dim), transparent);
  margin: 20px auto;
  position: relative;
}
.divider::before {
  content: '✦';
  position: absolute;
  left: 50%;
  top: 50%;
  transform: translate(-50%, -50%);
  color: var(--gold-dim);
  font-size: 10px;
  background: var(--void);
  padding: 0 6px;
}

/* Main panel */
.panel {
  background: linear-gradient(160deg, #0d0d1a, #080810);
  border: 1px solid #1e1e30;
  border-radius: 2px;
  padding: 32px;
  margin-bottom: 20px;
  position: relative;
}

.panel::before {
  content: '';
  position: absolute;
  inset: 0;
  border-radius: 2px;
  background: linear-gradient(135deg, #c8922a08 0%, transparent 50%);
  pointer-events: none;
}

.panel-title {
  font-family: 'Cinzel', serif;
  font-size: 11px;
  letter-spacing: 0.3em;
  text-transform: uppercase;
  color: var(--gold-dim);
  margin-bottom: 24px;
  display: flex;
  align-items: center;
  gap: 12px;
}

.panel-title::after {
  content: '';
  flex: 1;
  height: 1px;
  background: linear-gradient(90deg, var(--gold-dim), transparent);
  opacity: 0.4;
}

/* Floor slider */
.floor-section {
  margin-bottom: 32px;
}

.floor-label {
  display: flex;
  justify-content: space-between;
  align-items: baseline;
  margin-bottom: 16px;
}

.floor-label .name {
  font-family: 'Cinzel', serif;
  font-size: 14px;
  color: var(--text);
  letter-spacing: 0.1em;
}

.floor-label .value {
  font-family: 'Cinzel', serif;
  font-size: 28px;
  color: var(--gold);
  font-weight: 700;
  text-shadow: 0 0 20px #c8922a66;
  transition: color 0.3s;
}

.floor-label .zone-name {
  font-size: 13px;
  color: var(--text-dim);
  font-style: italic;
  text-align: right;
}

input[type=range] {
  -webkit-appearance: none;
  width: 100%;
  height: 4px;
  background: linear-gradient(90deg, var(--blood) var(--pct, 0%), #1e1e30 var(--pct, 0%));
  border-radius: 2px;
  outline: none;
  cursor: pointer;
  transition: background 0.1s;
}

input[type=range]::-webkit-slider-thumb {
  -webkit-appearance: none;
  width: 18px;
  height: 18px;
  border-radius: 50%;
  background: var(--gold);
  box-shadow: 0 0 12px #c8922a88;
  cursor: pointer;
  transition: box-shadow 0.2s;
}

input[type=range]::-webkit-slider-thumb:hover {
  box-shadow: 0 0 20px #c8922acc;
}

/* Zone indicator */
.zone-bar {
  display: flex;
  gap: 4px;
  margin-top: 16px;
}

.zone-seg {
  flex: 1;
  height: 3px;
  border-radius: 1px;
  background: #1e1e30;
  transition: background 0.4s, box-shadow 0.4s;
}

.zone-seg.active {
  background: var(--zone-color, var(--blood));
  box-shadow: 0 0 8px var(--zone-color, var(--blood));
}

/* Controls grid */
.controls {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 16px;
  margin-bottom: 24px;
}

.control-item {
  display: flex;
  flex-direction: column;
  gap: 8px;
}

.control-label {
  font-size: 11px;
  letter-spacing: 0.2em;
  text-transform: uppercase;
  color: var(--text-dim);
  font-family: 'Cinzel', serif;
}

.control-value {
  font-size: 18px;
  color: var(--text);
  font-family: 'Cinzel', serif;
}

/* Toggle buttons */
.toggles {
  display: flex;
  gap: 12px;
  flex-wrap: wrap;
  margin-bottom: 24px;
}

.toggle-btn {
  font-family: 'Cinzel', serif;
  font-size: 11px;
  letter-spacing: 0.15em;
  text-transform: uppercase;
  padding: 8px 16px;
  border: 1px solid #2a2a40;
  background: transparent;
  color: var(--text-dim);
  cursor: pointer;
  transition: all 0.2s;
  border-radius: 1px;
}

.toggle-btn:hover {
  border-color: var(--gold-dim);
  color: var(--text);
}

.toggle-btn.active {
  border-color: var(--gold);
  color: var(--gold);
  background: #c8922a12;
  box-shadow: 0 0 12px #c8922a22;
}

.toggle-btn.boss-btn.active {
  border-color: var(--blood-bright);
  color: var(--blood-bright);
  background: #cc2a2a12;
  box-shadow: 0 0 12px #cc2a2a44;
  animation: bossPulse 1.5s ease-in-out infinite;
}

@keyframes bossPulse {
  0%, 100% { box-shadow: 0 0 12px #cc2a2a44; }
  50% { box-shadow: 0 0 24px #cc2a2a88; }
}

/* Main play button */
.play-btn {
  width: 100%;
  padding: 18px;
  font-family: 'Cinzel', serif;
  font-size: 14px;
  font-weight: 700;
  letter-spacing: 0.25em;
  text-transform: uppercase;
  border: 1px solid var(--gold-dim);
  background: linear-gradient(135deg, #1a0e00, #0d0a00);
  color: var(--gold);
  cursor: pointer;
  transition: all 0.3s;
  position: relative;
  overflow: hidden;
  border-radius: 1px;
}

.play-btn::before {
  content: '';
  position: absolute;
  inset: 0;
  background: linear-gradient(135deg, #c8922a22, transparent);
  opacity: 0;
  transition: opacity 0.3s;
}

.play-btn:hover::before { opacity: 1; }
.play-btn:hover {
  border-color: var(--gold);
  box-shadow: 0 0 30px #c8922a33;
}

.play-btn.playing {
  border-color: var(--blood-bright);
  color: var(--blood-bright);
  background: linear-gradient(135deg, #1a0000, #0d0000);
  animation: playPulse 2s ease-in-out infinite;
}

@keyframes playPulse {
  0%, 100% { box-shadow: 0 0 20px #cc2a2a22; }
  50% { box-shadow: 0 0 40px #cc2a2a55; }
}

/* Visualizer */
.visualizer-wrap {
  margin-top: 20px;
  position: relative;
}

canvas {
  width: 100%;
  height: 80px;
  display: block;
  border: 1px solid #1a1a28;
  border-radius: 1px;
  background: #05050a;
}

/* Layer indicators */
.layers {
  display: flex;
  gap: 8px;
  margin-top: 16px;
  flex-wrap: wrap;
}

.layer-pill {
  font-size: 10px;
  letter-spacing: 0.15em;
  font-family: 'Cinzel', serif;
  text-transform: uppercase;
  padding: 4px 10px;
  border-radius: 1px;
  border: 1px solid #1e1e30;
  color: var(--text-dim);
  transition: all 0.5s;
  position: relative;
}

.layer-pill.on {
  border-color: currentColor;
  text-shadow: 0 0 8px currentColor;
  box-shadow: 0 0 10px currentColor44;
}

.layer-pill.drone   { color: #2a4a6a; }
.layer-pill.perc    { color: #6a2a2a; }
.layer-pill.bass    { color: #4a2a6a; }
.layer-pill.melody  { color: #2a6a4a; }
.layer-pill.choir   { color: #6a5a2a; }
.layer-pill.chaos   { color: #6a2a3a; }

/* Status bar */
.status {
  text-align: center;
  font-size: 13px;
  font-style: italic;
  color: var(--text-dim);
  margin-top: 16px;
  min-height: 20px;
  transition: color 0.3s;
}

/* Record section */
.record-section {
  display: flex;
  gap: 12px;
  align-items: center;
}

.record-btn {
  flex: 1;
  padding: 12px;
  font-family: 'Cinzel', serif;
  font-size: 11px;
  letter-spacing: 0.2em;
  text-transform: uppercase;
  border: 1px solid #2a2a40;
  background: transparent;
  color: var(--text-dim);
  cursor: pointer;
  transition: all 0.2s;
  border-radius: 1px;
}

.record-btn:hover { border-color: var(--blood-bright); color: var(--blood-bright); }

.record-btn.recording {
  border-color: var(--blood-bright);
  color: var(--blood-bright);
  animation: recPulse 1s ease-in-out infinite;
}

@keyframes recPulse {
  0%, 100% { opacity: 1; }
  50% { opacity: 0.5; }
}

.rec-dot {
  width: 8px; height: 8px;
  border-radius: 50%;
  background: var(--blood-bright);
  display: inline-block;
  margin-right: 6px;
  opacity: 0;
  transition: opacity 0.2s;
}

.recording .rec-dot {
  opacity: 1;
  animation: recPulse 1s ease-in-out infinite;
}

@media (max-width: 600px) {
  .controls { grid-template-columns: 1fr; }
  .panel { padding: 20px; }
}
</style>

</head>
<body>
<div class="container">
  <div class="header">
    <div class="crown">✦ Ashen Throne ✦</div>
    <h1>Music Forge<span>Adaptive Dungeon Synthesizer</span></h1>
    <div class="divider"></div>
  </div>

  <!-- Main synth panel -->

  <div class="panel">
    <div class="panel-title">Floor Depth</div>

    <div class="floor-section">
      <div class="floor-label">
        <div>
          <div class="name">Void Floor</div>
          <div class="value" id="floorNum">1</div>
        </div>
        <div class="zone-name" id="zoneName">Ashen Fields</div>
      </div>
      <input type="range" id="floorSlider" min="1" max="99" value="1"/>
      <div class="zone-bar" id="zoneBar"></div>
    </div>

    <div class="panel-title">Composition Layers</div>

    <div class="layers" id="layerPills">
      <div class="layer-pill drone" id="pill-drone">Drone</div>
      <div class="layer-pill perc" id="pill-perc">Percussion</div>
      <div class="layer-pill bass" id="pill-bass">Bass</div>
      <div class="layer-pill melody" id="pill-melody">Melody</div>
      <div class="layer-pill choir" id="pill-choir">Choir</div>
      <div class="layer-pill chaos" id="pill-chaos">Chaos</div>
    </div>

    <div class="toggles">
      <button class="toggle-btn active" id="btn-drone" onclick="toggleLayer('drone')">⬛ Drone</button>
      <button class="toggle-btn" id="btn-perc" onclick="toggleLayer('perc')">🥁 Percussion</button>
      <button class="toggle-btn" id="btn-bass" onclick="toggleLayer('bass')">〰 Bass</button>
      <button class="toggle-btn" id="btn-melody" onclick="toggleLayer('melody')">♪ Melody</button>
      <button class="toggle-btn" id="btn-choir" onclick="toggleLayer('choir')">🎼 Choir</button>
      <button class="toggle-btn boss-btn" id="btn-boss" onclick="toggleBoss()">⚡ Boss Mode</button>
    </div>

    <button class="play-btn" id="playBtn" onclick="togglePlay()">
      ▶ &nbsp; Invoke the Void
    </button>

    <div class="visualizer-wrap">
      <canvas id="viz" height="80"></canvas>
    </div>

    <div class="status" id="status">Awaiting invocation...</div>
  
  </div>

  <!-- Record panel -->

  <div class="panel">
    <div class="panel-title">Recording</div>
    <div class="record-section">
      <button class="record-btn" id="recBtn" onclick="toggleRecord()">
        <span class="rec-dot"></span>Record
      </button>
      <button class="record-btn" id="dlBtn" onclick="downloadRecording()" style="display:none">
        ↓ Download .wav
      </button>
    </div>
  </div>
</div>

//   • Floor changes crossfade: new nodes fade in while old ones fade out

    droneWave:'sawtooth', droneFilterFreq:550, droneFilterQ:5,
    droneLfoRate:0.28, droneLfoDepth:900, droneAmpLfo:0.22,
    kickFreq:48, kickDecay:0.45, snareDecay:0.18, snareFilterFreq:2000,
    kickPattern:[1,0,1,0,1,0,0,1], snarePattern:[0,1,0,1,0,0,1,0], hihatPattern:[1,1,0,1,0,1,1,0],
    bassWave:'sawtooth', bassFilterFreq:350, bassPattern:[0,4,2,5,0,3,6,2],
    melodyWave:'sawtooth', melodyOctave:2, melodySkip:0.05,
    melodyPatterns:[[0,1,4,2,6,5,2,4],[4,5,6,4,2,1,2,4],[0,6,5,4,2,4,5,6]],
    choirFormants:[800,1300,2600], choirVibRate:7, choirVibDepth:5,

  },
  {
    name:'Infernal Core', range:[51,99], color:'#8a1a1a', bpm:120,
    root:43.65, scale:[1,1.0595,1.1225,1.2599,1.4142,1.4983,1.7818],
    droneWave:'sawtooth', droneFilterFreq:800, droneFilterQ:7,
    droneLfoRate:0.4, droneLfoDepth:1200, droneAmpLfo:0.3,
    kickFreq:45, kickDecay:0.5, snareDecay:0.2, snareFilterFreq:2500,
    kickPattern:[1,1,0,1,1,0,1,0], snarePattern:[0,1,1,0,0,1,0,1], hihatPattern:[1,1,1,1,0,1,1,1],
    bassWave:'sawtooth', bassFilterFreq:500, bassPattern:[0,2,4,6,4,2,6,0],
    melodyWave:'sawtooth', melodyOctave:2, melodySkip:0,
    melodyPatterns:[[0,2,4,6,4,6,4,2],[6,4,2,0,2,4,6,4],[0,6,4,2,6,4,2,0]],
    choirFormants:[1000,1600,3200], choirVibRate:9, choirVibDepth:7,
    vizR:220, vizG:20, vizB:20,
    desc:'The core. Everything burns. Barely musical. Pure dread.'
  },
];

function getZone(floor) {
  return ZONES.find(z => floor >= z.range[0] && floor <= z.range[1]) || ZONES[ZONES.length - 1];
}
function getIntensity(floor) { return Math.min(1, (floor - 1) / 50); }

// ── Audio graph init ──────────────────────────────────────────────
// Called once. Creates master chain, permanent layer buses,
// and the recording destination — all permanently wired together.
function initAudio() {
  if (ctx) return;
  ctx = new (window.AudioContext || window.webkitAudioContext)();

  masterGain = ctx.createGain();
  masterGain.gain.value = 0.65;

  analyser = ctx.createAnalyser();
  analyser.fftSize = 256;

  masterGain.connect(analyser);
  analyser.connect(ctx.destination);

  // Recording destination wired once — survives all layer changes
  recDest = ctx.createMediaStreamDestination();
  masterGain.connect(recDest);

  // Permanent bus GainNodes — one per layer, always connected to master.
  // Layer start/stop only moves the bus gain, never reconnects anything.
  LAYER_NAMES.forEach(name => {
    const b = ctx.createGain();
    b.gain.value = 0;
    b.connect(masterGain);
    bus[name] = b;
  });
}

// ── Node/graph helpers ────────────────────────────────────────────
function mkOsc(freq, type = 'sine', detune = 0) {
  const o = ctx.createOscillator();
  o.type = type; o.frequency.value = freq; o.detune.value = detune;
  return o;
}
function mkGain(v)              { const g = ctx.createGain(); g.gain.value = v; return g; }
function mkFilter(f, type, Q=1) { const n = ctx.createBiquadFilter(); n.type = type; n.frequency.value = f; n.Q.value = Q; return n; }
function chain(...nn)           { for (let i = 0; i < nn.length - 1; i++) nn[i].connect(nn[i+1]); }

// Register nodes/timers to a layer for targeted cleanup
function reg(layerName, ...nn)  { nn.forEach(n => nodes[layerName].push(n)); }
function regT(layerName, id)    { timers[layerName].push(id); }

function scaleFreq(preset, octave, degree) {
  const r = preset.scale[degree % preset.scale.length];
  return preset.root * r * Math.pow(2, octave + Math.floor(degree / preset.scale.length));
}

// ── Fade helpers ──────────────────────────────────────────────────
function fadeIn(gainNode, targetVol, dur) {
  const now = ctx.currentTime;
  gainNode.gain.cancelScheduledValues(now);
  gainNode.gain.setValueAtTime(gainNode.gain.value, now);
  gainNode.gain.linearRampToValueAtTime(targetVol, now + dur);
}

function fadeOut(gainNode, dur, thenKill) {
  const now = ctx.currentTime;
  gainNode.gain.cancelScheduledValues(now);
  gainNode.gain.setValueAtTime(gainNode.gain.value, now);
  gainNode.gain.linearRampToValueAtTime(0, now + dur);
  if (thenKill) setTimeout(thenKill, (dur + 0.1) * 1000);
}

// ── Kill nodes belonging to one layer ────────────────────────────
function killLayer(name) {
  timers[name].forEach(clearTimeout);
  timers[name] = [];
  nodes[name].forEach(n => {
    try { if (n.stop) n.stop(ctx.currentTime + 0.04); n.disconnect(); } catch(e) {}
  });
  nodes[name] = [];
}

// ── Target bus volumes ────────────────────────────────────────────
function busTarget(name, intensity) {
  return { drone:0.5+intensity*0.25, perc:1.0, bass:0.9, melody:0.85,
           choir:0.55+intensity*0.2, chaos:0.45*intensity, boss:0.75 }[name] ?? 0.5;
}

// ── Layer builders — all route into bus[name], not masterGain ─────

function buildDrone(preset, intensity, layerName) {
  const b = bus[layerName];
  const filt = mkFilter(preset.droneFilterFreq + intensity*600, 'lowpass', preset.droneFilterQ);
  filt.connect(b);
  [preset.root, preset.root*1.5, preset.root*2, preset.root*3].forEach((f, i) => {
    const o = mkOsc(f, i===0 ? preset.droneWave : 'sine', (i-1)*9);
    const g = mkGain([0.35, 0.2, 0.12, 0.06][i]);
    chain(o, g, filt); o.start(); reg(layerName, o, g);
  });
  const detOsc = mkOsc(preset.root*2, preset.droneWave, 14);
  const detG   = mkGain(0.08);
  chain(detOsc, detG, filt); detOsc.start(); reg(layerName, detOsc, detG);

  const lfo  = mkOsc(preset.droneLfoRate + intensity*0.1, 'sine');
  const lfoG = mkGain(preset.droneLfoDepth + intensity*400);
  chain(lfo, lfoG); lfoG.connect(filt.frequency); lfo.start(); reg(layerName, lfo, lfoG);

  const aLfo  = mkOsc(preset.droneAmpLfo, 'sine');
  const aLfoG = mkGain(0.07 + intensity*0.06);
  chain(aLfo, aLfoG); aLfoG.connect(b.gain); aLfo.start(); reg(layerName, aLfo, aLfoG, filt);
}

// Build PCM buffers tuned to this preset (cheap, ~3ms)
function buildPercBufs(preset) {
  const sr = ctx.sampleRate;
  const kick = ctx.createBuffer(1, Math.floor(sr*preset.kickDecay*4), sr);
  const kd   = kick.getChannelData(0);
  for (let i = 0; i < kd.length; i++) {
    const t = i/sr;
    kd[i] = Math.sin(2*Math.PI * preset.kickFreq * Math.exp(-t*18) * t) * Math.exp(-t/preset.kickDecay) * 0.85;
  }
  const mkNoise = (decay) => {
    const buf = ctx.createBuffer(1, Math.floor(sr*decay*6), sr);
    const d   = buf.getChannelData(0);
    for (let i = 0; i < d.length; i++) d[i] = (Math.random()*2-1) * Math.exp(-(i/sr)/decay);
    return buf;
  };
  return { kick, snare: mkNoise(preset.snareDecay), hihat: mkNoise(0.022) };
}

function buildPerc(preset, intensity, layerName, bufs) {
  const b    = bus[layerName];
  const bpm  = isBoss ? preset.bpm+22 : preset.bpm;
  const beat = 60/bpm;
  const hhF  = mkFilter(preset.snareFilterFreq*4, 'highpass', 1);
  hhF.connect(b); reg(layerName, hhF);
  let t = ctx.currentTime + 0.05;

  function schedBar() {
    for (let i = 0; i < 8; i++) {
      const bt = t + i*beat*0.5;
      if (preset.kickPattern[i]) {
        const s = ctx.createBufferSource(); s.buffer = bufs.kick;
        const g = mkGain(0.65+intensity*0.35); chain(s, g, b); s.start(bt); reg(layerName, s, g);
      }
      if (preset.snarePattern[i] && intensity > 0.1) {
        const s = ctx.createBufferSource(); s.buffer = bufs.snare;
        const g = mkGain(0.35+intensity*0.45);
        const f = mkFilter(preset.snareFilterFreq, 'bandpass', 2.5);
        chain(s, f, g, b); s.start(bt); reg(layerName, s, f, g);
      }
      if (preset.hihatPattern[i] && intensity > 0.3) {
        const s = ctx.createBufferSource(); s.buffer = bufs.hihat;
        const g = mkGain(0.1+intensity*0.15); chain(s, g, hhF); s.start(bt); reg(layerName, s, g);
      }
    }
    t += beat*4;
    regT(layerName, setTimeout(schedBar, (beat*3.5)*1000));
  }
  schedBar();
}

function buildBass(preset, intensity, layerName) {
  const b    = bus[layerName];
  const bpm  = isBoss ? preset.bpm+22 : preset.bpm;
  const beat = 60/bpm;
  let t      = ctx.currentTime + 0.05;

  function schedBar() {
    for (let i = 0; i < 8; i++) {
      const bt   = t + i*beat*0.5;
      const freq = scaleFreq(preset, 0, preset.bassPattern[i]);
      const o    = mkOsc(freq, preset.bassWave);
      const env  = mkGain(0);
      const filt = mkFilter(preset.bassFilterFreq + intensity*300, 'lowpass', 3);
      chain(o, filt, env, b);
      const vol = 0.22 + intensity*0.18;
      env.gain.setValueAtTime(0, bt);
      env.gain.linearRampToValueAtTime(vol, bt+0.015);
      env.gain.exponentialRampToValueAtTime(0.001, bt+beat*0.45);
      o.start(bt); o.stop(bt+beat*0.5);
      reg(layerName, o, env, filt);
    }
    t += beat*4;
    regT(layerName, setTimeout(schedBar, (beat*3.6)*1000));
  }
  schedBar();
}

function buildMelody(preset, intensity, layerName) {
  const b    = bus[layerName];
  const bpm  = isBoss ? preset.bpm+22 : preset.bpm;
  const beat = 60/bpm;
  let patIdx = 0, t = ctx.currentTime + 0.1;

  function schedBar() {
    const pat = preset.melodyPatterns[patIdx++ % preset.melodyPatterns.length];
    for (let i = 0; i < pat.length; i++) {
      const bt = t + i*beat*0.5;
      if (Math.random() < preset.melodySkip) continue;
      const freq = scaleFreq(preset, preset.melodyOctave, pat[i]);
      const o1   = mkOsc(freq, preset.melodyWave);
      const o2   = mkOsc(freq*1.004, 'sine');
      const env  = mkGain(0);
      const filt = mkFilter(1200+intensity*1400, 'lowpass', 2);
      const g1   = mkGain(0.55), g2 = mkGain(0.28);
      chain(o1, g1, filt); chain(o2, g2, filt); chain(filt, env, b);
      const vol = 0.07+intensity*0.13, dur = beat*(0.28+Math.random()*0.35);
      env.gain.setValueAtTime(0, bt);
      env.gain.linearRampToValueAtTime(vol, bt+0.04);
      env.gain.setValueAtTime(vol*0.65, bt+dur*0.65);
      env.gain.linearRampToValueAtTime(0.001, bt+dur);
      o1.start(bt); o1.stop(bt+dur+0.1);
      o2.start(bt); o2.stop(bt+dur+0.1);
      reg(layerName, o1, o2, env, filt, g1, g2);
    }
    t += beat*4;
    regT(layerName, setTimeout(schedBar, (beat*3.6)*1000));
  }
  schedBar();
}

function buildChoir(preset, intensity, layerName) {
  const b = bus[layerName];
  [0,2,4].forEach((deg, vi) => {
    const freq = scaleFreq(preset, 2, deg);
    const o    = mkOsc(freq, 'sawtooth', vi*4);
    const f1   = mkFilter(preset.choirFormants[0], 'bandpass', 9);
    const f2   = mkFilter(preset.choirFormants[1], 'bandpass', 7);
    const f3   = mkFilter(preset.choirFormants[2], 'bandpass', 5);
    const m    = mkGain(0.38);
    chain(o, f1, m); chain(o, f2, m); chain(o, f3, m); m.connect(b);
    const vib  = mkOsc(preset.choirVibRate+vi*0.4, 'sine');
    const vibG = mkGain(preset.choirVibDepth);
    chain(vib, vibG); vibG.connect(o.frequency);
    vib.start(); o.start();
    reg(layerName, o, f1, f2, f3, m, vib, vibG);
  });
}

function buildChaos(preset, intensity, layerName) {
  const b = bus[layerName];
  [1.05,1.13,0.97,1.21].forEach((mult, i) => {
    const o    = mkOsc(preset.root*4*mult, i%2===0 ? 'square' : 'sawtooth', i*18-9);
    const filt = mkFilter(500+Math.random()*600, 'bandpass', 6);
    const env  = mkGain(0);
    const trem = mkOsc(6+i*3, 'sine');
    const tG   = mkGain(0.25);
    chain(trem, tG); tG.connect(env.gain);
    chain(o, filt, env, b);
    env.gain.linearRampToValueAtTime(0.03*intensity, ctx.currentTime+1.5);
    trem.start(); o.start();
    reg(layerName, o, filt, env, trem, tG);
  });
}

function buildBoss(preset, intensity, layerName) {
  const b = bus[layerName];
  [preset.root*0.5, preset.root*0.75].forEach((freq, i) => {
    const o    = mkOsc(freq, 'sawtooth', i*22);
    const filt = mkFilter(120, 'lowpass', 5);
    const env  = mkGain(0.12);
    const lfo  = mkOsc(1.8+i*0.6, 'square');
    const lfoG = mkGain(0.28);
    chain(lfo, lfoG); lfoG.connect(env.gain);
    chain(o, filt, env, b);
    env.gain.linearRampToValueAtTime(0.28, ctx.currentTime+1.2);
    lfo.start(); o.start(); reg(layerName, o, filt, env, lfo, lfoG);
  });
  const sh  = mkOsc(preset.root*8*preset.scale[1], 'sawtooth');
  const shF = mkFilter(2800, 'highpass', 4);
  const shE = mkGain(0);
  chain(sh, shF, shE, b);
  shE.gain.linearRampToValueAtTime(0.035, ctx.currentTime+2.5);
  sh.start(); reg(layerName, sh, shF, shE);
}

// ── Dispatch builder by name ─────────────────────────────────────
const BUILDERS = { drone:buildDrone, perc:buildPerc, bass:buildBass,
                   melody:buildMelody, choir:buildChoir, chaos:buildChaos, boss:buildBoss };

// Start one layer: kill old nodes, build fresh, fade bus in
function startLayer(name, preset, intensity, percBufs) {
  killLayer(name);
  if (name === 'perc') BUILDERS.perc(preset, intensity, name, percBufs);
  else                 BUILDERS[name](preset, intensity, name);
  fadeIn(bus[name], busTarget(name, intensity), FADE_IN);
}

// Stop one layer: fade bus out, then kill nodes
function stopLayer(name) {
  fadeOut(bus[name], FADE_OUT, () => killLayer(name));
}

// ── Full synth start ──────────────────────────────────────────────
function startSynth() {
  initAudio();
  const floor     = parseInt(slider.value);
  const preset    = getZone(floor);
  const intensity = isBoss ? Math.min(1, getIntensity(floor)+0.4) : getIntensity(floor);
  const percBufs  = buildPercBufs(preset);

  if (layerOn.drone)             startLayer('drone',  preset, intensity, null);
  if (layerOn.perc)              startLayer('perc',   preset, intensity, percBufs);
  if (layerOn.bass)              startLayer('bass',   preset, intensity, null);
  if (layerOn.melody)            startLayer('melody', preset, intensity, null);
  if (layerOn.choir)             startLayer('choir',  preset, intensity, null);
  if (intensity > 0.45)          startLayer('chaos',  preset, intensity, null);
  if (isBoss)                    startLayer('boss',   preset, intensity, null);

  setStatus(preset.desc);
}

// ── Full synth stop ───────────────────────────────────────────────
function stopSynth() {
  LAYER_NAMES.forEach(name => {
    const b = bus[name];
    if (b) { b.gain.cancelScheduledValues(ctx.currentTime); b.gain.setValueAtTime(0, ctx.currentTime); }
    killLayer(name);
  });
}

// ── Toggle play ───────────────────────────────────────────────────
function togglePlay() {
  if (!isPlaying) {
    isPlaying = true;
    document.getElementById('playBtn').textContent = '⏹  Silence the Void';
    document.getElementById('playBtn').classList.add('playing');
    startSynth();
    drawViz();
  } else {
    isPlaying = false;
    document.getElementById('playBtn').textContent = '▶  Invoke the Void';
    document.getElementById('playBtn').classList.remove('playing');
    stopSynth();
    setStatus('Silence reclaims the void...');
  }
}

// ── Toggle one layer — no global restart ─────────────────────────
function toggleLayer(name) {
  layerOn[name] = !layerOn[name];
  document.getElementById('btn-'+name).classList.toggle('active', layerOn[name]);
  document.getElementById('pill-'+name).classList.toggle('on',    layerOn[name]);

  if (!isPlaying) return;
  initAudio();
  const floor     = parseInt(slider.value);
  const preset    = getZone(floor);
  const intensity = isBoss ? Math.min(1, getIntensity(floor)+0.4) : getIntensity(floor);

  if (layerOn[name]) {
    const percBufs = (name === 'perc') ? buildPercBufs(preset) : null;
    startLayer(name, preset, intensity, percBufs);
    setStatus('+ ' + name);
  } else {
    stopLayer(name);
    setStatus('− ' + name);
  }
}

// ── Boss toggle — only touches boss layer ─────────────────────────
function toggleBoss() {
  isBoss = !isBoss;
  document.getElementById('btn-boss').classList.toggle('active', isBoss);
  if (!isPlaying) return;
  initAudio();
  const floor     = parseInt(slider.value);
  const preset    = getZone(floor);
  const intensity = Math.min(1, getIntensity(floor) + (isBoss ? 0.4 : 0));
  if (isBoss) {
    startLayer('boss', preset, intensity, null);
    setStatus('⚡ BOSS MODE — The void trembles...');
  } else {
    stopLayer('boss');
    setStatus('Boss slain. The silence returns.');
  }
}

// ── Floor slider — crossfade on zone change, instant on same zone ─
const slider = document.getElementById('floorSlider');
let floorDebounce = null;
let lastZoneName  = '';

function updateFloorUI() {
  const floor     = parseInt(slider.value);
  const zone      = getZone(floor);
  const intensity = getIntensity(floor);

  document.getElementById('floorNum').textContent  = floor;
  document.getElementById('zoneName').textContent  = zone.name;
  slider.style.setProperty('--pct', ((floor-1)/98*100).toFixed(1)+'%');

  const segs     = document.getElementById('zoneBar').querySelectorAll('.zone-seg');
  const zoneIdx  = ZONES.indexOf(zone);
  segs.forEach((s,i) => {
    s.classList.toggle('active', i <= zoneIdx);
    s.style.setProperty('--zone-color', zone.color);
  });

  const fn = document.getElementById('floorNum');
  fn.style.color      = `rgb(${zone.vizR},${zone.vizG},${zone.vizB})`;
  fn.style.textShadow = `0 0 ${20+intensity*30}px rgba(${zone.vizR},${zone.vizG},${zone.vizB},0.6)`;

  if (!isPlaying) { setStatus(zone.desc); return; }

  // Debounce — 250ms after slider settles
  clearTimeout(floorDebounce);
  floorDebounce = setTimeout(() => {
    initAudio();
    const newPreset   = getZone(parseInt(slider.value));
    const newIntensity = isBoss ? Math.min(1,getIntensity(parseInt(slider.value))+0.4)
                                : getIntensity(parseInt(slider.value));
    const percBufs = buildPercBufs(newPreset);
    const zoneChanged = (newPreset.name !== lastZoneName);
    lastZoneName = newPreset.name;

    // For each active layer: start new nodes (they fade in),
    // old nodes are replaced inside startLayer via killLayer
    if (layerOn.drone)          startLayer('drone',  newPreset, newIntensity, null);
    if (layerOn.perc)           startLayer('perc',   newPreset, newIntensity, percBufs);
    if (layerOn.bass)           startLayer('bass',   newPreset, newIntensity, null);
    if (layerOn.melody)         startLayer('melody', newPreset, newIntensity, null);
    if (layerOn.choir)          startLayer('choir',  newPreset, newIntensity, null);
    if (newIntensity > 0.45)    startLayer('chaos',  newPreset, newIntensity, null);
    else                        stopLayer('chaos');
    if (isBoss)                 startLayer('boss',   newPreset, newIntensity, null);

    setStatus(zoneChanged ? newPreset.desc : `Floor ${parseInt(slider.value)} · ${newPreset.name}`);
  }, 250);
}

(function(){
  const bar = document.getElementById('zoneBar');
  ZONES.forEach(() => { const s=document.createElement('div'); s.className='zone-seg'; bar.appendChild(s); });
  lastZoneName = getZone(1).name;
  updateFloorUI();
})();
slider.addEventListener('input', updateFloorUI);

// ── Visualizer ────────────────────────────────────────────────────
function drawViz() {
  if (!isPlaying) return;
  const canvas = document.getElementById('viz');
  const W = canvas.width  = canvas.offsetWidth  * devicePixelRatio;
  const H = canvas.height = canvas.offsetHeight * devicePixelRatio;
  const c = canvas.getContext('2d');
  const data = new Uint8Array(analyser ? analyser.frequencyBinCount : 128);
  if (analyser) analyser.getByteFrequencyData(data);
  c.fillStyle = '#05050a'; c.fillRect(0, 0, W, H);
  const z = getZone(parseInt(slider.value));
  const barW = W / data.length * 2.5;
  for (let i = 0; i < data.length; i++) {
    const h = (data[i]/255)*H*0.88;
    c.fillStyle = `rgba(${z.vizR},${z.vizG},${z.vizB},${0.35+(data[i]/255)*0.65})`;
    c.fillRect(i*barW, H-h, barW-1, h);
  }
  c.strokeStyle = `rgba(${z.vizR},${z.vizG},${z.vizB},0.25)`;
  c.lineWidth = 1.5; c.beginPath();
  for (let i = 0; i < data.length; i++) {
    const x=i*barW+barW/2, y=H-(data[i]/255)*H*0.88;
    i===0 ? c.moveTo(x,y) : c.lineTo(x,y);
  }
  c.stroke();
  requestAnimationFrame(drawViz);
}

// ── Recording ─────────────────────────────────────────────────────
// recDest is permanently wired to masterGain in initAudio().
// We only create MediaRecorder here — no reconnection needed.
function toggleRecord() {
  if (!isPlaying) { setStatus('Start playing first, then record.'); return; }
  initAudio(); // ensure recDest exists

  if (!isRecording) {
    recordedChunks = [];
    const mime = ['audio/webm;codecs=opus','audio/webm','audio/ogg;codecs=opus','audio/ogg']
                   .find(t => MediaRecorder.isTypeSupported(t)) || '';
    mediaRecorder = new MediaRecorder(recDest.stream, mime ? {mimeType: mime} : {});
    mediaRecorder.ondataavailable = e => { if (e.data.size > 0) recordedChunks.push(e.data); };
    mediaRecorder.start(200); // flush every 200ms
    isRecording = true;
    recSeconds  = 0;
    recTimerID  = setInterval(() => {
      recSeconds++;
      const m = Math.floor(recSeconds/60), s = String(recSeconds%60).padStart(2,'0');
      document.getElementById('recBtn').innerHTML =
        `<span class="rec-dot"></span>Stop &nbsp;${m}:${s}`;
    }, 1000);
    document.getElementById('recBtn').classList.add('recording');
    document.getElementById('recBtn').innerHTML = '<span class="rec-dot"></span>Stop &nbsp;0:00';
    document.getElementById('dlBtn').style.display = 'none';
    setStatus('⏺ Recording — add/remove layers freely');
  } else {
    mediaRecorder.stop();
    clearInterval(recTimerID);
    isRecording = false;
    document.getElementById('recBtn').classList.remove('recording');
    document.getElementById('recBtn').innerHTML = '<span class="rec-dot"></span>Record';
    document.getElementById('dlBtn').style.display = 'block';
    setStatus(`Recording saved — ${recSeconds}s`);
  }
}

function downloadRecording() {
  if (!recordedChunks.length) return;
  const mime = recordedChunks[0]?.type || 'audio/webm';
  const ext  = mime.includes('ogg') ? 'ogg' : 'webm';
  const zone = getZone(parseInt(slider.value));
  const blob = new Blob(recordedChunks, { type: mime });
  const url  = URL.createObjectURL(blob);
  const a    = document.createElement('a');
  a.href = url;
  a.download = 'ashen_throne_' + zone.name.replace(/[^a-z0-9]/gi,'_').toLowerCase()
             + '_floor' + slider.value + '.' + ext;
  a.click();
  URL.revokeObjectURL(url);
}

function setStatus(msg) { document.getElementById('status').textContent = msg; }

// Init pill display state
Object.keys(layerOn).forEach(k => {
  if (layerOn[k]) document.getElementById('pill-'+k).classList.add('on');
});
</script>
